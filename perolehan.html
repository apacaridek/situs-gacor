/* ================= OVERLAY ================= */
.popup-overlay {
  position: fixed;
  inset: 0;
  margin-bottom: 50px;
  background:

    rgb(0, 0, 0);
  display: flex;

      z-index: 1111;
  animation: overlayFade .45s ease forwards;
}

/* CLOSE VIA CHECKBOX */
#popup-close:checked + .popup-overlay {
  display: none;
}

/* ================= POPUP BOX ================= */
.popup-box {
  position: relative;
  width: 92%;
  max-width: 420px;
  background:
    linear-gradient(180deg,#0e0e0e,#141414);
  border-radius: 20px;
  overflow: hidden;
  box-shadow:
    0 0 25px rgba(21, 0, 255, 0.25),
    0 20px 60px rgba(0,0,0,.85);
  animation: popupZoom .45s ease forwards;
}

/* GLOW BORDER */
.popup-box::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 20px;
  padding: 0px;
  background: linear-gradient(
    135deg,
    transparent,
    #ffaa00,
    #6d0602,
    #ffaa00,
    transparent
  );
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* ================= CLOSE BUTTON ================= */
.popup-close {
  position: absolute;
  top: 12px;
  right: 14px;
  width: 34px;
  height: 34px;
  line-height: 34px;
  text-align: center;
  border-radius: 50%;
  background: rgba(0,0,0,.6);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
      z-index: 1112;
  transition: .25s ease;
}

.popup-close:hover {
  background: #ffaa00;
  color: #000;
  transform: rotate(90deg) scale(1.1);
}

/* ================= CONTENT ================= */

}

.popup-content h2 {

}

.popup-content p {

}

/* ================= CTA BUTTON ================= */
.popup-content .btn {
  position: relative;
  display: block;
  margin-top: 18px;
  padding: 14px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #ffd500;
  background:
    linear-gradient(90deg,#ffaa00,#6d0602,#ffaa00);
  background-size: 200% auto;
  box-shadow:
    0 0 18px #6d0602,
    0 10px 26px rgb(0, 0, 0);
  animation: pulseGlow 2s infinite ease-in-out;
  transition: .2s ease;
  overflow: hidden;
}

/* SHINE EFFECT */
.popup-content .btn::before {
  content: "";
  position: absolute;
  inset: 0;
  left: -80%;
  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(255,255,255,.6),
      transparent
    );
  transform: skewX(-20deg);
}

.popup-content .btn:hover {
  transform: scale(1.06);
  background-position: right center;
}

.popup-content .btn:hover::before {
  animation: shine .7s ease;
}

.popup-content .btn:active {
  transform: scale(.95);
}

/* ================= COPYRIGHT ================= */
.popup-content .copyright {
  margin-top: 14px;
  font-size: .75rem;
  color: #aaa;
  opacity: .7;
}

/* ================= ANIMATION ================= */
@keyframes popupZoom {
  from {
    opacity: 0;
    transform: scale(.75) translateY(20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes overlayFade {
  from { opacity: 0 }
  to   { opacity: 1 }
}

@keyframes pulseGlow {
  0% {
    box-shadow:
      0 0 12px #6d0602,
      0 10px 26px rgba(0,0,0,.7);
  }
  50% {
    box-shadow:
      0 0 28px #6d0602,
      0 14px 34px rgba(0,0,0,.85);
  }
  100% {
    box-shadow:
      0 0 12px #6d0602,
      0 10px 26px rgba(0,0,0,.7);
  }
}

@keyframes shine {
  from { left: -80% }
  to   { left: 120% }
}
